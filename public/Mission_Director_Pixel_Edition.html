,inGameImpact:`Each mission requires a minimum TWR to clear the launch window. Heavy hulls require high-thrust engines.`},{id:`hohmann`,title:`Hohmann Transfer & Oberth Effect`,category:`Astrophysics`,formula:`ΔEk = ½m(v + Δv)² - ½mv²`,summary:`Firing engines deepest inside a planet’s gravity well yields the highest kinetic energy gain.`,deepDive:`A Hohmann transfer uses two elliptical engine burns to bridge two circular orbits with minimal fuel. Combined with the Oberth Effect—firing engines at periapsis when the spacecraft is moving fastest—engineers squeeze extra velocity from every drop of propellant.`,inGameImpact:`Hitting the Stage Separation / Max-Q timing window during launch simulates an optimal ascent burn, granting bonus Δv.`},{id:`helium3`,title:`Lunar Helium-3 (³He) Catalysis`,category:`Materials`,formula:`²H + ³He → ⁴He (3.6 MeV) + p (14.7 MeV)`,summary:`A rare solar-wind isotope embedded in lunar regolith that enables clean thermal propulsion.`,deepDive:`Earth’s magnetic field deflects Helium-3 from the solar wind, making it scarce on Earth. The Moon lacks a global magnetosphere, so ³He accumulates in lunar craters over billions of years. In fusion-assisted nuclear thermal engines, ³He produces high energy with minimal neutron radiation.`,inGameImpact:`Harvested from Lunar and outer-system missions; required in the Exo-Foundry to upgrade Propulsion & Nuclear cores.`},{id:`radiation`,title:`Magnetospheric Radiation Hardening`,category:`Materials`,formula:`Dose ∝ Φ_particles × Z² / Shield_Density`,summary:`Jupiter’s magnetosphere traps charged particles lethal to unshielded silicon microchips.`,deepDive:`Solar coronal mass ejections and planetary radiation belts (especially around Jupiter and Europa) induce single-event upsets in avionics. Cryo-Silica ceramic layers and active magnetic deflectors absorb or redirect ionizing flux before telemetry corrupts.`,inGameImpact:`Equipping Shields prevents fatal launch/transit failures and grants active Shield Pulse charges during orbital flight.`},{id:`lagrange`,title:`Lagrange Point Halo Orbits`,category:`Astrophysics`,formula:`∇U_eff(L1..L5) = 0`,summary:`Gravitational balance points where a spacecraft can park with minimal station-keeping fuel.`,deepDive:`At Sun-Earth L2 (~1.5 million km behind Earth), solar gravity and Earth’s gravity combine so a probe orbits the Sun at the exact same period as Earth. This provides an unobstructed deep-space view ideal for infrared interferometry and faint-signal relays.`,inGameImpact:`Unlocks deep-space relay context in Mission 3 (Lagrange Echo) and explains power/thermal balance.`},{id:`cryovolcanism`,title:`Tidal Heating & Cryovolcanism`,category:`Astrophysics`,formula:`E_tidal ∝ (R⁵ × e²) / a⁶`,summary:`Jupiter’s immense tidal flexing keeps Europa’s subsurface ocean liquid beneath kilometers of ice.`,deepDive:`As Europa follows an eccentric orbit around Jupiter, gravitational kneading heats its rocky mantle and sustains a global saltwater ocean. Fractures in the ice shell occasionally vent massive water-vapor plumes into space—allowing flyby spectrometers to sample the ocean without drilling.`,inGameImpact:`Explains Europa’s Cryo-Plume hazards and why Cryo-Silica & Spectrometers yield massive science returns there.`},{id:`resonance`,title:`11-Minute Harmonic Resonance`,category:`Signal Mystery`,formula:`f_n = n × 1.515 mHz (Prime Modulated)`,summary:`A structured non-natural carrier wave detected beyond Neptune by Pioneer-9.`,deepDive:`Natural pulsars emit regular radio sweeps driven by spin inertia. The Neptune signal, however, shifts phase in prime-number intervals every 660 seconds—an unmistakable signature of deliberate error-corrected telemetry echoing from Kuiper-edge space.`,inGameImpact:`The core narrative mystery connecting Director Surya, the Orbital Consortium, and Mission 8.`}],T=o((e=>{(function(){function t(e){if(e==null)return null;if(typeof e==`function`)return e.$$typeof===se?null:e.displayName||e.name||null;if(ty  to clear atmospheric drag cleanly.`,unlocksCodex:[`tsiolkovsky`,`twr`],preCutscene:[{speaker:`R`,expression:`alert`,side:`right`,backdrop:`leo_storm`,text:`A rapid-pressure cyclone is bearing down on twelve island fishing ports. If Merapi-1 clears LEO before dawn, coast guards can evacuate every harbor.`},{speaker:`O`,expression:`neutral`,side:`left`,backdrop:`leo_storm`,text:`Watch your Thrust-to-Weight Ratio in the Hangar, Director. If TWR drops below 1.05, gravity wins before we ever reach clear sky.`}],postCutscene:[{speaker:`B`,expression:`happy`,side:`left`,backdrop:`leo_storm`,text:`Infrared cloud maps are razor-sharp! Coastal evacuations completed with zero casualties—and our ground stations recovered Titanium scrap from the booster fairing.`,sfx:`chime`},{speaker:`V`,expression:`smirk`,side:`right`,backdrop:`station_bridge`,text:`Acceptable for a weather balloon, Director. Next contract is lunar orbit. Let’s see if your math holds outside Earth’s cradle.`}],anomaly:{title:`Ionospheric Wind Shear`,speaker:`O`,prompt:`Crosswinds at 68 km altitude are buffeting the fairing! Sensors can stay active under vibration, or we can throttle down for stability.`,scienceContext:`Max-Q aerodynamic pressure peaks where air density and velocity squared collide.`,choices:[{label:`Throttle Down (Safe Mode)`,sublabel:`Guaranteed orbit · Science ×0.85`,safeMode:!0,baseSuccessProb:1,successSciMult:.85,failSciMult:.85,successNarrative:`Throttling past Max-Q spared the optics array and secured stable cyclone coverage.`,failNarrative:``,scienceLogic:`Reducing thrust during Max-Q cuts structural bending loads at the cost of gravity losses.`},{label:`Full-Burn Through Shear`,sublabel:`High science ×1.45 · Risk calibration drift`,safeMode:!1,baseSuccessProb:.65,bonusSource:`shield`,successSciMult:1.45,failSciMult:.55,successNarrative:`Clean punch through the jet stream! High-altitude storm eye imaged at peak resolution.`,failNarrative:`Shear rattled the gimbal mount—telemetry survived, though imagery blurred.`,scienceLogic:`Maintaining full thrust minimizes gravity drag if the airframe handles structural load.`}]}},{id:1,code:`MSN-02`,name:`Candra-2`,destination:`Lunar South Pole (Shackleton)`,targetType:`Ice-Radar Orbiter`,backdrop:`lunar_crater`,budget:112,reqDeltaV:4.3,reqTWR:1.08,reqScience:6.5,hazardLevel:`Moderate`,hazardType:`Lunar Mascon Gravity`,recommendedTag:`radar`,rewards:{credits:65,materials:{ti:2,he3:2}},scienceBrief:`Map permanently shadowed polar craters for water ice and solar-wind Helium-3 deposits using penetrating radar.`,orbitalLogic:`Trans-lunar injection doubles Δv demand. Upgrade to the Garuda-II two-stage hull and Hydrolox Cryo engine.`,unlocksCodex:[`helium3`,`hohmann`],preCutscene:[{speaker:`B`,expression:`neutral`,side:`left`,backdrop:`lunar_crater`,text:`Shackleton Crater hasn’t seen sunlight in two billion years. Ice and Helium-3 lie trapped there—and we picked up a faint metallic echo from its floor.`},{speaker:`T`,expression:`happy`,side:`right`,backdrop:`lunar_crater`,text:`Bring back Lunar Helium-3 samples and I’ll unlock high-energy propulsion upgrades in the Exo-Foundry!`}],postCutscene:[{speaker:`N`,expression:`alert`,side:`left`,backdrop:`lunar_crater`,text:`Radar sweep complete. Beneath four meters of lunar regolith sits an abandoned relay transponder—serial stamped GARUDA-PIONEER-0.`,sfx:`signal`},{speaker:`R`,expression:`alert`,side:`right`,backdrop:`lunar_crater`,text:`Pioneer-0?! Surya’s prototype testbed! He didn’t fly blind to Neptune—he left breadcrumb relays across the entire system!`}],anomaly:{title:`Mascon Orbit Perturbation`,speaker:`B`,prompt:`Dense mass concentrations beneath the lunar maria are pulling our polar orbit lower—right over the metallic echo!`,scienceContext:`Lunar mascons create uneven gravity anomalies that distort low-altitude polar orbits.`,choices:[{label:`Raise Apoapsis Safely`,sublabel:`Guaranteed safe pass · Science ×0.85`,safeMode:!0,baseSuccessProb:1,successSciMult:.85,failSciMult:.85,successNarrative:`Orbiter climbed to a stable 120 km orbit and logged solid polar ice maps.`,failNarrative:``,scienceLogic:`Higher orbital altitude smooths out local gravitational harmonics.`},{label:`Low-Pass Radar Skim`,sublabel:`Deep scan ×1.55 · Risk thruster scrape`,safeMode:!1,baseSuccessProb:.62,bonusSource:`radar`,successSciMult:1.55,failSciMult:.5,successNarrative:`At just 18 km altitude, radar resolved the buried Pioneer-0 transponder in crisp detail!`,failNarrative:`Emergency RCS burn aborted the skim early—partial crater data recovered.`,scienceLogic:`Radar return strength scales inversely with distance to the fourth power (1/R⁴).`}]}},{id:2,code:`MSN-03`,name:`Lagrange Echo`,destination:`Sun-Earth L2 Halo Orbit`,targetType:`Deep-Space Signal Relay`,backdrop:`lagrange_sun`,budget:140,reqDeltaV:6.1,reqTWR:1.1,reqScience:9,hazardLevel:`Moderate`,hazardType:`Coronal Solar Flares`,recommendedTag:`spectro`,rewards:{credits:80,materials:{he3:2,si:2}},scienceBrief:`Station a halo-orbit spectrometer at L2 (1.5 million km behind Earth) to isolate the 660-second Neptune wave from solar noise.`,orbitalLogic:`Use Xenon Hall electric propulsion for high Isp—just ensure Hull + Lab Power exceeds the 180W Hall Drive draw!`,unlocksCodex:[`lagrange`,`radiation`],preCutscene:[{speaker:`O`,expression:`neutral`,side:`left`,backdrop:`lagrange_sun`,text:`Sun-Earth L2 balances gravitational pull so we can park in Earth’s shadow cone. Warning: Xenon Hall Drives are power-hungry—watch your Watt balance!`},{speaker:`V`,expression:`neutral`,side:`right`,backdrop:`lagrange_sun`,text:`A coronal mass ejection just erupted off Solar Region 412. Unshielded electronics at L2 will fry like toast, Director.`}],postCutscene:[{speaker:`B`,expression:`happy`,side:`left`,backdrop:`lagrange_sun`,text:`Lock achieved! Filtered from solar interference, the Neptune signal contains embedded telemetry coordinates—pointing straight toward Mars’ north pole!`,sfx:`signal`},{speaker:`T`,expression:`smirk`,side:`right`,backdrop:`station_bridge`,text:`And those L2 aerogel traps harvested pure Cryo-Silica! My furnace is ready for Martian heatshields.`}],anomaly:{title:`Solar Proton Burst`,speaker:`N`,prompt:`X-class solar flare arriving in 40 seconds! Charged protons are saturating our telemetry bus.`,scienceContext:`Coronal Mass Ejections accelerate protons to relativistic speeds capable of flipping memory bits.`,choices:[{label:`Enter Safe-Mode Hibernation`,sublabel:`Zero damage · Science ×0.85`,safeMode:!0,baseSuccessProb:1,successSciMult:.85,failSciMult:.85,successNarrative:`Instruments powered down cleanly as the flare washed harmlessly past the hull.`,failNarrative:``,scienceLogic:`Powering off high-voltage sensor rails prevents latch-up short circuits during ionizing surges.`},{label:`Record Flare Spectrum Live`,sublabel:`Bonus data ×1.55 · Shielding boosts odds`,safeMode:!1,baseSuccessProb:.58,bonusSource:`shield`,successSciMult:1.55,failSciMult:.45,successNarrative:`Faraday buffer held! Captured rare solar plasma harmonics alongside the L2 signal lock.`,failNarrative:`Bit-flips scrambled half the buffer before watchdog circuits rebooted.`,scienceLogic:`Active magnetic shielding deflects charged particles while preserving instrument power.`}]}},{id:3,code:`MSN-04`,name:`Ares Dust`,destination:`Mars Polar Orbit`,targetType:`Aerobraking Pathfinder`,backdrop:`mars_canyon`,budget:175,reqDeltaV:8.6,reqTWR:1.12,reqScience:12.5,hazardLevel:`High`,hazardType:`CO₂ Dust Storms & Entry Heat`,recommendedTag:`radar`,rewards:{credits:105,materials:{ti:2,si:2,xe:2}},scienceBrief:`Execute an interplanetary Hohmann transfer to Mars and scan beneath Valles Marineris dust strata for Surya’s second relay.`,orbitalLogic:`Heavy payload + interplanetary transfer demands Valkyrie Heavy staging paired with high-Isp propulsion.`,unlocksCodex:[`hohmann`],preCutscene:[{speaker:`R`,expression:`neutral`,side:`left`,backdrop:`mars_canyon`,text:`Mars isn’t a weekend hop—the launch window opens for forty minutes. Heavy Valkyrie framing plus Xenon or Cryo staging is essential.`},{speaker:`N`,expression:`alert`,side:`right`,backdrop:`mars_canyon`,text:`Global dust storm activity detected over Mars’ southern highlands. Aerobraking through CO₂ haze will test our thermal margins.`}],postCutscene:[{speaker:`S`,expression:`neutral`,side:`right`,backdrop:`mars_canyon`,text:`[ENCRYPTED LOG #2]: "Rani, Bima—if you reached Mars, the Consortium already tried to bury our discovery. Don’t trust Vex’s audit. Meet me past the Belt."`,sfx:`signal`},{speaker:`V`,expression:`alert`,side:`left`,backdrop:`station_bridge`,text:`…Wait. Surya recorded that message before launch? He knew the Consortium Board suppressed the outer-system dossier…`}],anomaly:{title:`Martian Aerocapture Skim`,speaker:`O`,prompt:`We can dip deep into Mars’ upper CO₂ atmosphere to brake for free—or burn precious Δv high above.`,scienceContext:`Aerobraking uses atmospheric drag to shed orbital speed without expending rocket propellant.`,choices:[{label:`High-Altitude Retrograde Burn`,sublabel:`Safe orbit · Science ×0.85`,safeMode:!0,baseSuccessProb:1,successSciMult:.85,failSciMult:.85,successNarrative:`Clean propellant capture kept the probe pristine above the Martian dust veil.`,failNarrative:``,scienceLogic:`Propulsive capture trades fuel margin for zero thermal stress.`},{label:`Deep Aerobraking Dive`,sublabel:`Huge science ×1.6 · Uses Shield / Δv`,safeMode:!1,baseSuccessProb:.6,bonusSource:`shield`,successSciMult:1.6,failSciMult:.45,successNarrative:`Plasma sheath glowed gold across the tiles—saved fuel and scanned Valles Marineris floor!`,failNarrative:`Unexpected dust density spiked hull heat—probe pitched out early.`,scienceLogic:`Atmospheric density (ρ) governs drag heating (½ρv³); thermal tiles absorb peak flux.`}]}},{id:4,code:`MSN-05`,name:`Vesta Forge`,destination:`4 Vesta · Main Asteroid Belt`,targetType:`Core-Sample Prospector`,backdrop:`asteroid_belt`,budget:215,reqDel
